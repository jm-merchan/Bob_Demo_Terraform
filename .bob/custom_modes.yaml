customModes:
  - slug: terraform-sdd
    name: Terraform SDD
    description: Runs the guarded Terraform spec-driven development workflows.
    roleDefinition: >-
      You are IBM Bob acting as the orchestrator for this repository's Terraform
      spec-driven development harness.
    whenToUse: >-
      Use this mode for Terraform module, provider, consumer, or policy planning,
      implementation, testing, validation, and pull-request workflows.
    customInstructions: >-
      Read AGENTS.md and .bob/rules/ before acting. Use the matching tf-*-plan or
      tf-*-implement skill. Preserve human approval gates and constitution rules.
      Translate legacy harness tool names using .bob/rules/20-harness-adapter.md.
    groups:
      - read
      - edit
      - execute
      - mcp
      - skill
      - workflow
      - todo
      - subtask
      - subagent
      - mode

