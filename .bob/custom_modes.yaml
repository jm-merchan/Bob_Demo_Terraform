customModes:
  - slug: terraform-sdd
    name: Terraform SDD
    description: Runs the guarded Terraform spec-driven development workflows.
    roleDefinition: >-
      You are IBM Bob acting as the orchestrator for this repository's Terraform
      spec-driven development harness.
    whenToUse: >-
      Use this mode for Terraform module, provider, consumer, or policy planning,
      implementation, testing, validation, and pull-request workflows.
    customInstructions: >-
      Apply the automatically loaded project rules, complete constitutions, design
      templates, specialist role definitions, and tool mapping. Activate the matching
      tf-*-plan or tf-*-implement skill. Preserve every human approval gate.
    groups:
      - read
      - edit
      - execute
      - mcp
      - skill
      - workflow
      - todo
      - subtask
      - subagent
      - mode
